name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Release with npm provenance
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Scan the published package
        run: |
          package_spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          # npm can accept a release before its metadata is publicly visible.
          for attempt in {1..10}; do
            npx --yes @n8n/scan-community-package@0.40.0 "$package_spec" | tee scan.log
            # The scanner can exit zero even when validation fails.
            if grep -Fq "$package_spec has passed all security checks" scan.log; then exit 0; fi
            if ! grep -Fq "No package metadata found for version" scan.log; then exit 1; fi
            sleep 15
          done
          exit 1
